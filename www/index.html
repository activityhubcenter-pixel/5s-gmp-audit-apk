<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>5S &amp; GMP Audit</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #2e1065 0%, #065f46 100%);
      color: #ffffff;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      padding: 32px 24px;
      max-width: 360px;
      width: 100%;
    }
    .badge {
      display: inline-block;
      background: #10b981;
      color: #06281e;
      font-weight: 800;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 14px;
      margin-bottom: 16px;
    }
    h1 { font-size: 22px; margin-bottom: 10px; }
    p { font-size: 14px; line-height: 1.5; opacity: 0.9; margin-bottom: 24px; }
    a.btn {
      display: inline-block;
      width: 100%;
      padding: 14px;
      background: #10b981;
      color: #052e16;
      font-weight: 700;
      text-decoration: none;
      border-radius: 12px;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">5S &amp; GMP AUDIT</div>
    <h1>กำลังเชื่อมต่อระบบ...</h1>
    <p>หากหน้าจอไม่โหลดอัตโนมัติ กรุณาตรวจสอบสัญญาณอินเทอร์เน็ตแล้วกดปุ่มด้านล่าง</p>
    <a class="btn" href="https://script.google.com/macros/s/AKfycbwUsuNPD-1eP0V8TzOIpbuN3kdi0f_xUrdR3wJ_5wfulyGh2mzHbXxiPWCBlLTG4M4wQQ/exec">เข้าสู่ระบบตรวจประเมิน</a>
  </div>
</body>
</html>
