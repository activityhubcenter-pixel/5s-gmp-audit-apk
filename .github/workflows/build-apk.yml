name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Generate App Icons and Splash Screen
        run: npx capacitor-assets generate --android

      - name: Configure Android Permissions and WebView
        run: node scripts/configure-android.js

      - name: Sync Capacitor project
        run: npx cap sync android

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 5S-GMP-Audit-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
